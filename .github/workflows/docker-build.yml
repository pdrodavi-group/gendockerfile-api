name: Build and Publish Docker Image

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    environment: production

    env:
      IMAGE: docker.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
      SHA_TAG: ${{ github.sha }}
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # necessário para tags semânticas

      - name: Extract semantic version (if exists)
        id: semver
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA_TAG }}
            ${{ env.IMAGE }}:${{ env.BRANCH_NAME }}
            ${{ steps.semver.outputs.version != '' && format('{0}:{1}', env.IMAGE, steps.semver.outputs.version) || '' }}
            ${{ env.BRANCH_NAME == 'main' && format('{0}:latest', env.IMAGE) || '' }}
